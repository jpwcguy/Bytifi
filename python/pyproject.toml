[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bytifi"
version = "0.2.10"
description = "Official Bytifi CLI — encrypt, upload, and decrypt files from the terminal"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Bytifi" }]
keywords = ["bytifi", "cli", "encryption", "upload", "file-sharing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://bytifi.com"
Repository = "https://github.com/jpwcguy/Bytifi"
Issues = "https://github.com/jpwcguy/Bytifi/issues"

[project.optional-dependencies]
dev = ["build>=1.2.0", "twine>=5.0.0"]

[project.scripts]
bytifi = "bytifi.cli:main"
